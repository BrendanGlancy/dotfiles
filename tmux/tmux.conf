set -a terminal-features "tmux-256color:RGB"
set -g base-index 1
set -g mode-keys vi
set -g status-position bottom
set -g status-justify absolute-centre
set -g status-style "bg=default"
set -g window-status-current-style "fg=blue bold"

# Name each window after what the session is doing, not the process.
# Claude Code already publishes a per-session topic as the pane title
# ("TECH-6430 driver scoped reads"); tmux otherwise shows "claude" for all of them.
# Non-claude panes keep the command name.
set -g automatic-rename-format '#{?#{==:#{pane_current_command},claude},#{s/ .*//:#{s/✳ //:pane_title}},#{pane_current_command}}'
set -g status-interval 5
set -g status-right '#{?pane_in_mode,COPY ,}#{?client_prefix, _ ,}#(timew | awk "/^ *Total/ {print \$NF}") #[bg=green,fg=black,bold]#(timew | awk "/^ *Tracking/ {print \" \" \$NF \" \"}")#[bg=default]'
set-option -g set-clipboard on

# Mouse: wheel drives tmux's own scrollback (copy-mode), even over
# fullscreen apps that grab the mouse (e.g. Claude Code).
set -g mouse on
set -g history-limit 50000
bind -n WheelUpPane copy-mode -e

set -s escape-time 0
bind r source-file ~/.config/tmux/tmux.conf

set-window-option -g mode-keys vi
# <C-b>[ enter vi mode
# bind -T copy-mode-vi v send-keys -X begin-selection
# bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"

# vim-like pane switching
bind -r ^ last-window
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

bind -r f run-shell "tmux neww tmux-sessionizer"
